<div class="min-h-screen bg-[#0a1628]">

  <!-- Header -->
  <header class="border-b border-white/5 sticky top-0 z-50 backdrop-blur-xl bg-[#0a1628]/80">
    
    <!-- Línea de acento superior (mejorada) -->
    <div class="absolute top-0 left-0 right-0 h-[3px] bg-gradient-to-r from-[#e63946] via-[#ffd700] to-[#e63946]"></div>

    <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">

      <!-- Logo (mejorado con hover efecto) -->
      <a routerLink="/partidos" class="flex items-center gap-2 group flex-1">
        <div class="relative">
          <span class="text-3xl block transition-all duration-300 group-hover:scale-110 group-hover:rotate-6">
            <img src="logo.png" alt="Logo" class="w-12 h-12">
          </span>
        </div>
        <div class="flex flex-col">
          <span class="text-white font-black text-lg uppercase tracking-[0.2em] leading-none group-hover:text-[#e63946] transition-colors duration-300">Porra Mundial</span>
          <span class="text-[#ffd700] font-bold text-[10px] tracking-[0.3em] uppercase">FIFA World Cup 2026</span>
        </div>
      </a>

      <!-- Navegación (mejorada: líneas centradas y más elegantes) -->
      <nav class="flex items-center">
        <a routerLink="/partidos" routerLinkActive="active-link"
           class="relative px-6 py-5 text-sm font-semibold text-gray-400 hover:text-white transition-colors duration-200 group">
           PARTIDOS
           <span class="absolute bottom-0 left-1/2 -translate-x-1/2 w-0 h-0.5 bg-[#e63946] group-hover:w-full transition-all duration-300 origin-center rounded-full"></span>
        </a>
        <a routerLink="/ranking" routerLinkActive="active-link"
           class="relative px-6 py-5 text-sm font-semibold text-gray-400 hover:text-white transition-colors duration-200 group">
           RANKING
           <span class="absolute bottom-0 left-1/2 -translate-x-1/2 w-0 h-0.5 bg-[#ffd700] group-hover:w-full transition-all duration-300 origin-center rounded-full"></span>
        </a>
        @if (usuario?.rol === 'admin') {
          <a routerLink="/admin" routerLinkActive="active-link"
             class="relative px-6 py-5 text-sm font-semibold text-gray-400 hover:text-white transition-colors duration-200 group">
             ADMIN
             <span class="absolute bottom-0 left-1/2 -translate-x-1/2 w-0 h-0.5 bg-white group-hover:w-full transition-all duration-300 origin-center rounded-full"></span>
          </a>
        }
      </nav>

      <!-- Usuario + Salir (EXACTAMENTE COMO ESTABA - sin cambios) -->
      <!-- Usuario + Salir -->
<div class="flex items-center gap-5 flex-1 justify-end">
  <div class="flex flex-col items-end">
    <span class="text-white text-sm font-bold leading-none">{{ usuario?.nombre }}</span>
    <span class="text-[#ffd700] text-xs font-black mt-1 tracking-wider">{{ usuario?.puntosTotales }} PTS</span>
  </div>
  <div class="w-px h-8 bg-white/10"></div>

  <!-- Avatar con lápiz -->
  <div class="relative group cursor-pointer" (click)="abrirSelectorFoto()">
    @if (fotoPerfil()) {
      <img [src]="fotoPerfil()" class="w-9 h-9 rounded-full object-cover ring-2 ring-white/20 group-hover:ring-[#e63946]/50 transition-all duration-300" />
    } @else {
      <div class="w-9 h-9 rounded-full bg-white/10 flex items-center justify-center ring-2 ring-white/20 group-hover:ring-[#e63946]/50 transition-all duration-300">
        <span class="text-white font-black text-sm">{{ usuario?.nombre?.charAt(0).toUpperCase() }}</span>
      </div>
    }
    <div class="absolute inset-0 rounded-full bg-black/50 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-200">
      <span class="text-white text-xs">✏️</span>
    </div>
  </div>

  <button (click)="logout()"
    class="text-gray-500 hover:text-red-400 text-xs font-bold uppercase tracking-widest transition-all duration-200">
    <span>Salir</span>
    <span class="text-base group-hover:translate-x-1 transition-transform duration-200 ml-1">→</span>
  </button>
</div>

    </div>
  </header>

  <!-- Contenido -->
  <router-outlet />

</div>
