<div class="min-h-screen bg-[#0a1628] flex items-center justify-center px-4">
  <div class="w-full max-w-md">

    <!-- Logo y título -->
   <div class="flex items-center justify-center gap-3 mb-8">
  <img src="logo.png" alt="Logo" class="w-14 h-14">
  <div class="flex flex-col">
    <span class="text-white font-black text-2xl uppercase tracking-[0.2em] leading-none">Porra Mundial</span>
    <span class="text-[#ffd700] font-bold text-[9px] tracking-[0.3em] uppercase mt-1">FIFA World Cup 2026</span>
  </div>
</div>

    <!-- Card -->
    <div class="bg-white/5 backdrop-blur border border-white/10 rounded-2xl p-8">
      <h2 class="text-white text-2xl font-bold mb-6 text-center">Iniciar sesión</h2>

      @if (error) {
        <div class="bg-red-500/20 border border-red-500/50 text-red-400 px-4 py-3 rounded-lg mb-4 text-sm">
          {{ error }}
        </div>
      }

      <form (ngSubmit)="onSubmit()">
        <div class="mb-4">
          <label class="block text-gray-400 text-sm font-medium mb-2">Email</label>
          <input
            type="email"
            [(ngModel)]="datos.email"
            name="email"
            placeholder="tu@email.com"
            required
            class="w-full bg-white/10 border border-white/20 text-white placeholder-gray-500 rounded-lg px-4 py-3 focus:outline-none focus:border-[#e63946] transition"
          />
        </div>

        <div class="mb-6">
          <label class="block text-gray-400 text-sm font-medium mb-2">Contraseña</label>
          <input
            type="password"
            [(ngModel)]="datos.password"
            name="password"
            placeholder="Tu contraseña"
            required
            class="w-full bg-white/10 border border-white/20 text-white placeholder-gray-500 rounded-lg px-4 py-3 focus:outline-none focus:border-[#e63946] transition"
          />
        </div>

        <button
          type="submit"
          [disabled]="cargando"
          class="w-full bg-[#e63946] hover:bg-[#c1121f] disabled:bg-gray-600 text-white font-bold py-3 rounded-lg uppercase tracking-wider transition">
          {{ cargando ? 'Entrando...' : 'Entrar' }}
        </button>
      </form>
      <!-- Separador -->
      <div class="flex items-center gap-3 my-4">
        <div class="flex-1 h-px bg-white/10"></div>
        <span class="text-gray-500 text-xs">o</span>
        <div class="flex-1 h-px bg-white/10"></div>
      </div>

      <!-- Botón Google -->
      <div id="google-btn" class="flex justify-center"></div>
      <p class="text-center text-gray-400 mt-6 text-sm">
        ¿No tienes cuenta?
        <a routerLink="/registro" class="text-[#ffd700] font-bold hover:underline">Regístrate aquí</a>
      </p>
    </div>

  </div>
</div>
