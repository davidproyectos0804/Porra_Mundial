<div class="min-h-screen bg-[#0a1628] flex items-center justify-center px-4 py-8">
  <div class="w-full max-w-md">

    <!-- Logo y título -->
    <div class="text-center mb-8">
      <h1 class="text-4xl font-black text-white tracking-wider uppercase">Porra Mundial</h1>
      <p class="text-[#ffd700] font-bold text-lg tracking-widest uppercase mt-1">2026</p>
    </div>

    <!-- Card -->
    <div class="bg-white/5 backdrop-blur border border-white/10 rounded-2xl p-8">
      <h2 class="text-white text-2xl font-bold mb-6 text-center">Crear cuenta</h2>

      @if (error) {
        <div class="bg-red-500/20 border border-red-500/50 text-red-400 px-4 py-3 rounded-lg mb-4 text-sm">
          {{ error }}
        </div>
      }


      <form (ngSubmit)="onSubmit()">
        <div class="mb-4">
          <label class="block text-gray-400 text-sm font-medium mb-2">Nombre</label>
          <input
            type="text"
            [(ngModel)]="datos.nombre"
            name="nombre"
            placeholder="Tu nombre"
            required
            class="w-full bg-white/10 border border-white/20 text-white placeholder-gray-500 rounded-lg px-4 py-3 focus:outline-none focus:border-[#e63946] transition"
          />
        </div>

        <div class="mb-4">
          <label class="block text-gray-400 text-sm font-medium mb-2">Email</label>
          <input
            type="email"
            [(ngModel)]="datos.email"
            name="email"
            placeholder="tu@email.com"
            required
            class="w-full bg-white/10 border border-white/20 text-white placeholder-gray-500 rounded-lg px-4 py-3 focus:outline-none focus:border-[#e63946] transition"
          />
        </div>

        <div class="mb-4">
          <label class="block text-gray-400 text-sm font-medium mb-2">Contraseña</label>
          <input
            type="password"
            [(ngModel)]="datos.password"
            name="password"
            placeholder="Tu contraseña"
            required
            class="w-full bg-white/10 border border-white/20 text-white placeholder-gray-500 rounded-lg px-4 py-3 focus:outline-none focus:border-[#e63946] transition"
          />
        </div>

        <div class="mb-6">
          <label class="block text-gray-400 text-sm font-medium mb-2">Confirmar contraseña</label>
          <input
            type="password"
            [(ngModel)]="datos.confirmarPassword"
            name="confirmarPassword"
            placeholder="Repite tu contraseña"
            required
            class="w-full bg-white/10 border border-white/20 text-white placeholder-gray-500 rounded-lg px-4 py-3 focus:outline-none focus:border-[#e63946] transition"
          />
        </div>

        <button
          type="submit"
          [disabled]="cargando"
          class="w-full bg-[#e63946] hover:bg-[#c1121f] disabled:bg-gray-600 text-white font-bold py-3 rounded-lg uppercase tracking-wider transition">
          {{ cargando ? 'Creando cuenta...' : 'Crear cuenta' }}
        </button>
      </form>

      <p class="text-center text-gray-400 mt-6 text-sm">
        ¿Ya tienes cuenta?
        <a routerLink="/login" class="text-[#ffd700] font-bold hover:underline">Inicia sesión</a>
      </p>
    </div>

  </div>
</div>
