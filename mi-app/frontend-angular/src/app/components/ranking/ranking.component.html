
  <div class="max-w-2xl mx-auto px-4 py-8">

    <!-- Título -->
    <div class="text-center mb-8">
      <h2 class="text-4xl font-black text-white uppercase tracking-wider">🏆 Ranking</h2>
    </div>

    @if (cargando()) {
      <p class="text-gray-400 text-center py-12">Cargando ranking...</p>
    }

    @if (!cargando()) {
      <div class="flex flex-col gap-3">
        @for (usuario of ranking(); track usuario._id; let i = $index) {
          <div [class]="usuario._id === this.usuario?._id
            ? 'bg-[#ffd700]/10 border border-[#ffd700]/40 rounded-2xl px-6 py-4 flex items-center gap-4'
            : 'bg-white/5 border border-white/10 rounded-2xl px-6 py-4 flex items-center gap-4 hover:border-white/20 transition'">

            <!-- Posición -->
            <span class="text-2xl w-10 text-center">{{ getMedalla(i) }}</span>

            <!-- Nombre -->
            <span [class]="usuario._id === this.usuario?._id
              ? 'flex-1 text-[#ffd700] font-black text-lg'
              : 'flex-1 text-white font-bold text-lg'">
              {{ usuario.nombre }}
              @if (usuario._id === this.usuario?._id) {
                <span class="text-xs font-medium text-[#ffd700]/70 ml-2">(tú)</span>
              }
            </span>

            <!-- Puntos -->
            <span [class]="usuario._id === this.usuario?._id
              ? 'text-[#ffd700] font-black text-xl'
              : 'text-white font-black text-xl'">
              {{ usuario.puntosTotales }}
              <span class="text-sm font-medium text-gray-400 ml-1">pts</span>
            </span>

          </div>
        }
      </div>
    }

    <!-- Volver -->
    <div class="text-center mt-8">
      <a routerLink="/partidos" class="text-gray-400 hover:text-white text-sm transition">
        ← Volver a partidos
      </a>
    </div>

  </div>
