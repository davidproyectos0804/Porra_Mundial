<div class="min-h-screen bg-[#0a1628] flex items-center justify-center px-4">
  <div class="w-full max-w-md text-center">

    <div class="text-6xl mb-6"><img src="logo.png" alt="Logo" class="w-24 h-24 mx-auto"></div>
    <h1 class="text-4xl font-black text-white tracking-wider uppercase mb-2">Porra Mundial</h1>
    <p class="text-[#ffd700] font-bold text-lg tracking-widest uppercase mb-8">2026</p>

    <div class="bg-white/5 border border-white/10 rounded-2xl p-8">

      @if (estado() === 'cargando') {
        <div class="text-gray-400">
          <div class="text-4xl mb-4">⏳</div>
          <p class="text-lg">{{ mensaje() }}</p>
        </div>
      }

      @if (estado() === 'exito') {
        <div class="text-emerald-400">
          <div class="text-4xl mb-4">✅</div>
          <p class="text-lg font-bold mb-6">{{ mensaje() }}</p>
          <a routerLink="/login"
            class="bg-[#e63946] hover:bg-[#c1121f] text-white font-bold py-3 px-8 rounded-lg uppercase tracking-wider transition">
            Iniciar sesión
          </a>
        </div>
      }

      @if (estado() === 'error') {
        <div class="text-red-400">
          <div class="text-4xl mb-4">❌</div>
          <p class="text-lg font-bold mb-6">{{ mensaje() }}</p>
          <a routerLink="/registro"
            class="bg-[#e63946] hover:bg-[#c1121f] text-white font-bold py-3 px-8 rounded-lg uppercase tracking-wider transition">
            Volver al registro
          </a>
        </div>
      }

    </div>

  </div>
</div>
