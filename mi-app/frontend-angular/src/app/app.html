<main>
  <h1>Mi App Fullstack</h1>

  <!-- Mensaje del backend -->
  <section>
    <h2>Mensaje del backend:</h2>
    <p>{{ message() }}</p>
  </section>

  <!-- Error si lo hay -->
  @if (error()) {
    <p style="color: red">{{ error() }}</p>
  }

  <!-- Lista de usuarios -->
  <section>
    <h2>Usuarios:</h2>
    @for (user of users(); track user.id) {
      <div>
        <strong>{{ user.name }}</strong> — {{ user.email }}
      </div>
    }
  </section>
</main>
